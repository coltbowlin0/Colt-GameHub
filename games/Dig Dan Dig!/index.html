        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body,
            html {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #000000;
                user-select: none;
                -webkit-user-select: none;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #gameCanvas {
                image-rendering: pixelated;
                image-rendering: crisp-edges;
                image-rendering: -moz-crisp-edges;
                -ms-interpolation-mode: nearest-neighbor;
                background: #000000;
                box-shadow: 0 0 0 2px #2a2a3a;
                cursor: crosshair;
                touch-action: none;
            }

            #loadingOverlay {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                background: #000000;
                color: #50ff50;
                font-family: monospace;
                letter-spacing: 1px;
            }

            #loadingText {
                min-height: 18px;
                font-size: 14px;
                text-transform: uppercase;
            }

            #loadingBar {
                width: min(360px, 72vw);
                height: 14px;
                padding: 2px;
                overflow: hidden;
                border: 2px solid #50ff50;
                background: #000000;
            }

            #loadingFill {
                width: 0%;
                height: 100%;
                background: #50ff50;
                transition: width 120ms linear;
            }

            #loadingOverlay[data-mode="indeterminate"] #loadingFill {
                width: 35%;
                animation: loadingSweep 1s ease-in-out infinite alternate;
            }

            #loadingOverlay[data-mode="error"] #loadingFill {
                width: 100%;
                background: #50ff50;
                animation: none;
            }

            @keyframes loadingSweep {
                from {
                    transform: translateX(0%);
                }
                to {
                    transform: translateX(185%);
                }
            }
        </style>
